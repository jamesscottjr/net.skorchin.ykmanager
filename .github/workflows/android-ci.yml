name: Android CI

# Continuous integration: compiles the app, runs the unit tests and packages a
# debug APK on every push to main and every pull request. The release pipeline
# (release.yml) handles signed builds and GitHub Releases.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          # Only the default branch writes to the remote cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build metadata
        id: meta
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "YK Manager $VERSION_NAME (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "app/build/test-results/testDebugUnitTest/*.xml"
          check_name: Unit test results
          fail_on_failure: false
          require_tests: false

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release APK (debug-signed check build)
        # Compiles the release variant too so release-only problems surface on
        # pull requests. No keystore is available here, so Gradle signs it with
        # the debug key; the real signed package is produced by release.yml.
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YKManager-v${{ steps.meta.outputs.version_name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
